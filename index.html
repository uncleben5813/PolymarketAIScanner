<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Polymarket AI Prediction Machine</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#07111f;
  color:#e8eef7;
}
.container{
  max-width:1400px;
  margin:auto;
  padding:20px;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}
h1{
  margin:0;
  font-size:25px;
}
.sub{
  color:#8ea1b8;
  font-size:13px;
  margin-top:5px;
}
.status{
  padding:8px 12px;
  border:1px solid #29415e;
  border-radius:10px;
  font-size:12px;
  background:#0b192b;
}
.status.ok{color:#55e39b}
.status.err{color:#ff7373}

.stats{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:12px;
  margin-bottom:20px;
}
.stat{
  background:#0c1a2b;
  border:1px solid #1c314a;
  border-radius:14px;
  padding:15px;
}
.stat .label{
  color:#8195ad;
  font-size:12px;
}
.stat .value{
  font-size:21px;
  font-weight:700;
  margin-top:6px;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}
input,select,button{
  background:#0c1a2b;
  color:#e8eef7;
  border:1px solid #29415e;
  border-radius:10px;
  padding:11px 13px;
}
input{
  flex:1;
  min-width:220px;
}
button{
  cursor:pointer;
}
button:hover{
  background:#12263d;
}

.message{
  padding:25px;
  text-align:center;
  border:1px dashed #29415e;
  border-radius:14px;
  color:#91a4bb;
  margin-top:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.card{
  background:#0c1a2b;
  border:1px solid #1c314a;
  border-radius:16px;
  padding:17px;
  min-width:0;
}
.card:hover{
  border-color:#3a5d83;
}

.card-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}

.rank{
  color:#6f86a0;
  font-size:12px;
}

.question{
  font-size:16px;
  font-weight:700;
  line-height:1.35;
  margin:10px 0 14px;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:7px;
  font-size:11px;
  font-weight:700;
}
.yes{
  background:#123b2c;
  color:#5ff0a6;
}
.no{
  background:#412024;
  color:#ff858d;
}
.neutral{
  background:#263548;
  color:#b9c6d6;
}

.prices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:13px;
}

.pricebox{
  background:#081522;
  border-radius:10px;
  padding:12px;
}
.pricebox .label{
  color:#7d91aa;
  font-size:11px;
}
.pricebox .price{
  font-size:22px;
  font-weight:800;
  margin-top:4px;
}

.meta{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

.meta-box{
  background:#081522;
  border-radius:9px;
  padding:9px;
}
.meta-label{
  color:#71869e;
  font-size:10px;
}
.meta-value{
  font-size:12px;
  font-weight:700;
  margin-top:3px;
}

.ai{
  margin-top:13px;
  padding:12px;
  background:#101f31;
  border-radius:10px;
  border:1px solid #203750;
}
.ai-title{
  color:#8da4bd;
  font-size:11px;
}
.ai-value{
  margin-top:4px;
  font-size:19px;
  font-weight:800;
}

.footer{
  color:#60758e;
  text-align:center;
  font-size:11px;
  margin:30px 0 10px;
}

@media(max-width:1100px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:650px){
  .container{padding:12px}
  header{align-items:flex-start}
  h1{font-size:20px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
  .meta{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<div class="container">

<header>
  <div>
    <h1>Polymarket AI Prediction Machine</h1>
    <div class="sub">Live market scanner • AI probability • edge detection</div>
  </div>
  <div id="status" class="status">Connecting...</div>
</header>

<section class="stats">
  <div class="stat">
    <div class="label">Markets</div>
    <div class="value" id="statMarkets">—</div>
  </div>

  <div class="stat">
    <div class="label">Active</div>
    <div class="value" id="statActive">—</div>
  </div>

  <div class="stat">
    <div class="label">Volume</div>
    <div class="value" id="statVolume">—</div>
  </div>

  <div class="stat">
    <div class="label">Liquidity</div>
    <div class="value" id="statLiquidity">—</div>
  </div>

  <div class="stat">
    <div class="label">Avg YES</div>
    <div class="value" id="statAvgYes">—</div>
  </div>

  <div class="stat">
    <div class="label">Updated</div>
    <div class="value" id="statUpdated">—</div>
  </div>
</section>

<div class="toolbar">
  <input
    id="search"
    type="search"
    placeholder="Search markets..."
  >

  <select id="signalFilter">
    <option value="all">All signals</option>
    <option value="YES">YES</option>
    <option value="NO">NO</option>
    <option value="NEUTRAL">Neutral</option>
  </select>

  <select id="sort">
    <option value="volume">Volume</option>
    <option value="liquidity">Liquidity</option>
    <option value="yes">YES probability</option>
    <option value="edge">AI edge</option>
  </select>

  <button id="refresh">Refresh</button>
</div>

<div id="message" class="message">
  Loading live Polymarket markets...
</div>

<div id="grid" class="grid"></div>

<div class="footer">
  Data source: Polymarket Gamma API + CLOB
</div>

</div>

<script>
"use strict";

const API = "/api/markets";

let markets = [];
let stats = {};
let loading = false;

const $ = id => document.getElementById(id);

function number(v, fallback = 0){
  const n = Number(v);
  return Number.isFinite(n) ? n : fallback;
}

function money(v){
  const n = number(v);

  if(n >= 1000000000)
    return "$" + (n / 1000000000).toFixed(2) + "B";

  if(n >= 1000000)
    return "$" + (n / 1000000).toFixed(2) + "M";

  if(n >= 1000)
    return "$" + (n / 1000).toFixed(1) + "K";

  return "$" + n.toFixed(0);
}

function percent(v){
  let n = number(v);

  if(n <= 1) n *= 100;

  return n.toFixed(2) + "%";
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function getYes(m){
  return number(
    m?.yes?.price ??
    m?.yes?.probability ??
    m?.marketYes ??
    m?.outcomePrices?.[0]
  );
}

function getNo(m){
  return number(
    m?.no?.price ??
    m?.no?.probability ??
    m?.marketNo ??
    m?.outcomePrices?.[1]
  );
}

function getAI(m){
  if(m?.aiYes !== undefined)
    return number(m.aiYes);

  if(m?.modelYes !== undefined)
    return number(m.modelYes);

  if(m?.ai?.yes !== undefined)
    return number(m.ai.yes);

  if(m?.prediction?.yes !== undefined)
    return number(m.prediction.yes);

  return null;
}

function getEdge(m){
  if(m?.edge !== undefined)
    return number(m.edge);

  if(m?.edgePct !== undefined)
    return number(m.edgePct) / 100;

  const ai = getAI(m);
  const yes = getYes(m);

  if(ai !== null)
    return ai - yes;

  return null;
}

function getSignal(m){
  if(m?.signal?.side)
    return String(m.signal.side).toUpperCase();

  const yes = getYes(m);

  if(yes >= 0.80) return "YES";
  if(yes >= 0.65) return "YES";
  if(yes <= 0.20) return "NO";
  if(yes <= 0.35) return "NO";

  return "NEUTRAL";
}

function signalClass(signal){
  if(signal === "YES") return "yes";
  if(signal === "NO") return "no";
  return "neutral";
}

function signalText(m){
  if(m?.signal?.strength)
    return m.signal.strength;

  return getSignal(m);
}

function normalizeMarket(m){
  return {
    ...m,

    question:
      m?.question ||
      "Unknown market",

    yes:
      getYes(m),

    no:
      getNo(m),

    ai:
      getAI(m),

    edge:
      getEdge(m),

    volume:
      number(m?.volume),

    volume24h:
      number(m?.volume24h),

    liquidity:
      number(m?.liquidity),

    signal:
      getSignal(m)
  };
}

function setStatus(text, type = ""){
  const el = $("status");

  el.textContent = text;
  el.className = "status " + type;
}

function updateStats(){
  const s = stats || {};

  $("statMarkets").textContent =
    number(s.total || markets.length).toLocaleString();

  $("statActive").textContent =
    number(s.active).toLocaleString();

  $("statVolume").textContent =
    money(s.totalVolume);

  $("statLiquidity").textContent =
    money(s.totalLiquidity);

  $("statAvgYes").textContent =
    percent(s.avgYesProbability);

  $("statUpdated").textContent =
    new Date().toLocaleTimeString();
}

function render(){
  const search =
    $("search").value.trim().toLowerCase();

  const filter =
    $("signalFilter").value;

  const sort =
    $("sort").value;

  let data = markets
    .map(normalizeMarket)
    .filter(m => {

      const matchesSearch =
        !search ||
        m.question.toLowerCase().includes(search) ||
        String(m.category || "")
          .toLowerCase()
          .includes(search);

      const matchesSignal =
        filter === "all" ||
        m.signal === filter;

      return matchesSearch && matchesSignal;
    });

  data.sort((a,b) => {

    if(sort === "liquidity")
      return b.liquidity - a.liquidity;

    if(sort === "yes")
      return b.yes - a.yes;

    if(sort === "edge")
      return Math.abs(b.edge ?? 0) -
             Math.abs(a.edge ?? 0);

    return b.volume - a.volume;
  });

  $("message").style.display =
    data.length ? "none" : "block";

  $("message").textContent =
    data.length
      ? ""
      : "No matching markets found.";

  $("grid").innerHTML =
    data.map((m,index) => {

      const signal = m.signal;
      const cls = signalClass(signal);

      const aiText =
        m.ai === null
          ? "Not available"
          : percent(m.ai);

      const edgeText =
        m.edge === null
          ? "—"
          : percent(m.edge);

      return `
        <article class="card">

          <div class="card-top">
            <div class="rank">#${index + 1}</div>

            <span class="badge ${cls}">
              ${escapeHtml(signal)}
            </span>
          </div>

          <div class="question">
            ${escapeHtml(m.question)}
          </div>

          <div class="prices">

            <div class="pricebox">
              <div class="label">YES probability</div>
              <div class="price">
                ${percent(m.yes)}
              </div>
            </div>

            <div class="pricebox">
              <div class="label">NO probability</div>
              <div class="price">
                ${percent(m.no)}
              </div>
            </div>

          </div>

          <div class="ai">
            <div class="ai-title">
              AI Prediction
            </div>

            <div class="ai-value">
              ${aiText}
            </div>

            ${
              m.ai !== null
              ? `<div class="sub">
                   AI Edge: ${edgeText}
                 </div>`
              : ""
            }
          </div>

          <div class="meta">

            <div class="meta-box">
              <div class="meta-label">
                SIGNAL
              </div>
              <div class="meta-value">
                ${escapeHtml(signalText(m))}
              </div>
            </div>

            <div class="meta-box">
              <div class="meta-label">
                VOLUME
              </div>
              <div class="meta-value">
                ${money(m.volume)}
              </div>
            </div>

            <div class="meta-box">
              <div class="meta-label">
                LIQUIDITY
              </div>
              <div class="meta-value">
                ${money(m.liquidity)}
              </div>
            </div>

          </div>

        </article>
      `;
    })
    .join("");
}

async function load(){
  if(loading) return;

  loading = true;

  setStatus("Loading...");

  try{

    const response =
      await fetch(
        API + "?limit=100&details=true",
        {
          cache:"no-store",
          headers:{
            "Accept":"application/json"
          }
        }
      );

    if(!response.ok){
      throw new Error(
        "HTTP " + response.status
      );
    }

    const json =
      await response.json();

    console.log("POLYMARKET API:", json);

    if(!json || json.ok !== true){
      throw new Error(
        json?.error ||
        json?.message ||
        "API returned ok:false"
      );
    }

    if(!Array.isArray(json.markets)){
      throw new Error(
        "API response has no markets array"
      );
    }

    markets = json.markets;

    stats =
      json.stats ||
      {
        total: markets.length,
        active: markets.filter(
          m => m.active && !m.closed
        ).length,
        totalVolume: markets.reduce(
          (sum,m) =>
            sum + number(m.volume),
          0
        ),
        totalLiquidity: markets.reduce(
          (sum,m) =>
            sum + number(m.liquidity),
          0
        ),
        avgYesProbability:
          markets.length
            ? markets.reduce(
                (sum,m) =>
                  sum + getYes(m),
                0
              ) /
              markets.length *
              100
            : 0
      };

    updateStats();
    render();

    setStatus(
      markets.length
        ? "LIVE • " + markets.length + " markets"
        : "API OK • No markets",
      markets.length ? "ok" : ""
    );

  }catch(error){

    console.error(
      "Dashboard API error:",
      error
    );

    markets = [];

    $("grid").innerHTML = "";

    $("message").style.display = "block";

    $("message").innerHTML =
      "<strong>API connected but dashboard failed to load.</strong><br><br>" +
      escapeHtml(error.message);

    setStatus(
      "API ERROR",
      "err"
    );

  }finally{
    loading = false;
  }
}

$("search").addEventListener(
  "input",
  render
);

$("signalFilter").addEventListener(
  "change",
  render
);

$("sort").addEventListener(
  "change",
  render
);

$("refresh").addEventListener(
  "click",
  load
);

load();

setInterval(
  load,
  60000
);
</script>

</body>
</html>
